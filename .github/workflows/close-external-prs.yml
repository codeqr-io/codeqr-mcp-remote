name: Close external PRs

# Este repositório não aceita contribuições externas. Como o GitHub não permite
# desativar pull requests em repositórios públicos, qualquer PR aberto de fora
# da equipe é fechado automaticamente.
#
# Usa `pull_request_target` para rodar no contexto do repositório base (token com
# permissão de escrita). O código do PR NUNCA é baixado nem executado — o job só
# lê metadados do evento, então não há risco de execução de código não confiável.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    # O teste é a origem do branch, não a associação do autor.
    #
    # A versão anterior checava `author_association` contra OWNER/MEMBER/
    # COLLABORATOR, e fechou o PR #4 — aberto por um admin da organização, de um
    # branch deste próprio repositório. Esse campo carrega apenas o que é
    # publicamente visível: com a associação à organização definida como
    # privada, um mantenedor chega ao payload como se fosse alguém de fora, e o
    # workflow fecha o PR do próprio time.
    #
    # `head.repo` não tem essa ambiguidade. Num repositório público, quem não
    # tem acesso de escrita não consegue criar branch aqui — só pode abrir PR a
    # partir de um fork. Logo, branch deste repositório implica acesso de
    # escrita, e isso vale independentemente de a associação ser pública ou não.
    #
    # Duas consequências, ambas desejadas:
    #   - um membro do time que abrir PR a partir de um fork pessoal também é
    #     fechado; a saída é empurrar o branch para este repositório, que é o
    #     fluxo normal do time;
    #   - um colaborador com acesso `read` ou `triage` passava antes (contava
    #     como COLLABORATOR) e agora é fechado, que é o comportamento correto:
    #     ele não tem escrita aqui.
    #
    # Se `head.repo` for nulo — fork apagado entre a abertura e o evento — a
    # comparação é verdadeira e o PR é fechado. Falhar fechando é o lado seguro.
    #
    # Sem allowlist de bots: Dependabot e Renovate criam branches neste
    # repositório, não em forks, então passam por esta mesma regra. (Não é o
    # argumento usado para `author_association` — a allowlist testava
    # `user.login`, que nada tem a ver com visibilidade de associação. Hoje o
    # repositório não tem nenhum dos dois configurado. Se um dia adotarem
    # Renovate em fork mode, ele passa a cair aqui e precisa voltar.)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # Fechar vem primeiro, e sozinho. Antes, o comentário rodava antes do
      # fechamento no mesmo passo `bash -e`: um rate limit secundário ou uma
      # conversa trancada abortava o passo e deixava o PR externo ABERTO —
      # o efeito de política ficava encadeado atrás do de cortesia.
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr close "$PR_URL"

      # Só na abertura. O autor de um PR externo pode reabri-lo à vontade, e
      # comentar em cada ciclo transforma o workflow em ferramenta de flood no
      # próprio repositório. Reabrir continua fechando; só não repete o texto.
      #
      # `continue-on-error` porque isto é cortesia: a política já foi aplicada
      # no passo acima, e uma falha ao comentar não deve marcar a execução como
      # se o PR tivesse escapado.
      - name: Explain why
        if: github.event.action == 'opened'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_URL" --body "Thanks for your interest. This repository does not accept external pull requests — changes are made by the CodeQR team only.

          If you found a bug or have a suggestion, please open an [issue](https://github.com/${REPO}/issues) instead and we'll take a look.

          _Closed automatically._"
